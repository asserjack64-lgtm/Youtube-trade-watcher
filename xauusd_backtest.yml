name: XAUUSD V4 Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Number of days to backtest"
        required: true
        default: "180"

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run XAUUSD V4 backtest
        run: |
          python xauusd_backtest.py \
            --days "${{ inputs.days }}" \
            --output xauusd_v4_trades.csv

      - name: Upload backtest results
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-v4-results
          path: xauusd_v4_trades.csv
