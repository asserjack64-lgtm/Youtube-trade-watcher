name: Strategy Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days of BTCUSDT history to test"
        required: true
        default: "180"

jobs:
  backtest:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run strategy backtest
        run: |
          python backtests.py --days "${{ inputs.days }}" --train-days "120"

      - name: Upload backtest results
        uses: actions/upload-artifact@v4
        with:
          name: strategy-backtest-v4-results
          path: |
            backtest_v4_validation_trades.csv
            backtest_v4_training_trades.csv
            backtest_v4_training_robustness.csv
          if-no-files-found: ignore
