name: Strategy V5 Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Total BTCUSDT history to test"
        required: true
        default: "365"

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run V5 strategy backtest
        run: |
          python backtest_v5.py --days "${{ inputs.days }}" --train-days 240 --validation-days 60

      - name: Upload V5 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-v5-backtest-results
          path: |
            backtest_v5_*.csv
          if-no-files-found: ignore
