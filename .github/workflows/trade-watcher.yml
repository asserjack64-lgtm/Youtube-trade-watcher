name: BTC Liquidity Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

jobs:

  monitor:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests pandas matplotlib

      - name: Test Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          response = requests.post(
              url,
              data={
                  "chat_id": chat_id,
                  "text": "🟢 BTC Liquidity Monitor Telegram test"
              },
              timeout=20
          )

          print("Telegram status:", response.status_code)
          print("Telegram response:", response.text)

          response.raise_for_status()
          PY

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python -u Bot.py

      - name: Save trade state
        run: |

          if [ -f trade_state.json ]; then

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add trade_state.json

            if git diff --cached --quiet; then
              echo "No trade state changes to save."
            else
              git commit -m "Update trade state"
              git push
            fi

          else

            echo "No trade state file created. No new trade signal."

          fi
