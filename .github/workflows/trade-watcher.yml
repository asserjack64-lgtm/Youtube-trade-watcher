name: BTC Liquidity Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

    # 23:55 UTC = 05:25 AM IST
    # Daily report will be sent at this time.
    - cron: "55 23 * * *"

jobs:

  monitor:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests pandas matplotlib

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python -u Bot.py

      - name: Daily EOD Report
        if: github.event_name == 'schedule' && github.event.schedule == '55 23 * * *'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python - <<'PY'
          import Bot
          Bot.send_daily_report()
          PY

      - name: Save bot state
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Add any state files that actually exist.
          git add -A trade_state.json trade_history.json report_state.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No state changes to save."
          else
            git commit -m "Update paper trading state"
            git push
          fi
