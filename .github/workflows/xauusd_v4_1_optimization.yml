name: XAUUSD V4.1 Optimization

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run V4.1 parameter sweep
        run: |
          python xauusd_v4_1_optimizer.py

      - name: Upload V4.1 results
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-v4-1-optimization
          path: |
            xauusd_v4_1_parameter_sweep.csv
            xauusd_v4_1_top10.csv
            xauusd_v4_1_walkforward.csv

      - name: Commit optimization results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xauusd_v4_1_parameter_sweep.csv xauusd_v4_1_top10.csv xauusd_v4_1_walkforward.csv
          git diff --cached --quiet || git commit -m "Add XAUUSD V4.1 optimization results"
          git push
